NMEA-0183:

  sentences:
    -
      GPGGA:
        description: Global Positioning System Fix Data
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: latitude
            type: Position
          3:
            name: longitude
            type: Position
          4:
            name: fix_quality
            type: Enum
            param: '[{"0": "fix not available"}, {"1": "GPS Fix"}, {"2": "Differential GPS fix"} ]'
          5:
            name: satellites
            type: long
          6:
            name: hdop
            type: double
          7:
            name: altitude
            type: Height
          8:
            name: height_of_geoid
            type: Height
          9:
            name: time_since_dgps
            type: long
          10:
            name: dgps_reference_id
            type: String


      GPGLL:
        description: Geographic position, latitude / longitude
        syntax:
          1:
            name: latitude
            type: Position
          2:
            name: longitude
            type: Position
          3:
            name: time
            type: UTCTime
          4:
            name: GLLStatus
            type: Enum
            param: '[{"A": "Data Valid"},{"V": "Data Invalid"} ]'

      GPGSA:
        description: GPS DOP and active satellites
        syntax:
          1:
            name: selectionMode
            type: Enum
            param: '[{"M": "Manual"},{"A": "Automatic"}]'
          2:
            name: mode
            type: Enum
            param: '[{"1": "Not available"}, {"2":"2D"}, {"3":"3D"}]'
          3:
            name: id
            type: long
            repeat: 12
          4:
            name: PDOP
            type: double
          5:
            name: HDOP
            type: double
          6:
            name: VDOP
            type: double

      GPGSV:
        description: GPS Satellites in view
        syntax:
          1:
            name: totalMessages
            type: long
          2:
            name: messageNumber
            type: long
          3:
            name: satellitesInView
            type: long
          4:
            name: satelliteNumber
            type: long
          5:
            name: elevationInDegrees
            type: double
          6:
            name: azimuthInDegreesToTrue
            type: double
          7:
            name: snrIndb
            type: double

      GPHDT:
        description: Heading, True
        syntax:
          1:
            name: headingDegreesTrue
            type: double
          2:
            name: true
            type: boolean
            param: "T"

      GPRMC:
        description: Recommended minimum specific GPS/Transit data
        syntax:
          1:
            name: Time
            type: UTCTime
          2:
            name: RMCStatus
            type: Enum
            param: '[{"V": "Navigation receiver warning"},{"A": "Valid" }]'
          3:
            name: latitude
            type: Position
          4:
            name: longitude
            type: Position
          5:
            name: speedOverGround
            type: double
          6:
            name: trackMadeGood
            type: double
          7:
            name: date
            type: Date
          8:
            name: magneticVariation
            type: Position

      GPVTG:
        description: Recommended minimum specific GPS/Transit data
        syntax:
          1:
            name: trackTrue
            type: double
          2:
            name: trackIndicator
            type: boolean
            param: T
          3:
            name: trackMag
            type: double
          4:
            name: trackMagIndicator
            type: boolean
            param: M
          5:
            name: speedOverGround
            type: double
          6:
            name: nauticalSpeedIndicator
            type: char
          7:
            name: kmPerHour
            type: double
          8:
            name: kmPerHourIndicator
            type: char
          9:
            name: modeIndicator
            type: Enum
            param: '[{"A": "Autonomous"},{"D": "Differential"},{"E": "Estimated (dead reckoning) mode"},{"M": "Manual input"},{"N": "Data not valid"}]'

      GPZDA:
        description: UTC time and date information
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: day
            type: long
          3:
            name: month
            type: long
          4:
            name: year
            type: long
          5:
            name: localZoneHours
            type: long
          6:
            name: localZoneMinutes
            type: long

      GLGGA:
        description: GLONASS Fix Data
        aliasOf: GPGGA

      GLGLL:
        description: GLONASS Geographic position, latitude / longitude
        aliasOf: GPGLL

      GLGSA:
        description: GLONASS DOP and active satellites
        aliasOf: GPGSA

      GLGSV:
        description: GLONASS Satellites in view
        aliasOf: GPGSV

      GLRMC:
        description: GLONASS Recommended minimum specific data
        aliasOf: GPRMC

      GLVTG:
        description: GLONASS Track and speed
        aliasOf: GPVTG

      GLZDA:
        description: GLONASS Time and date
        aliasOf: GPZDA

      BDGGA:
        description: BeiDou Fix Data
        aliasOf: GPGGA

      BDGLL:
        description: BeiDou Geographic position, latitude / longitude
        aliasOf: GPGLL

      BDGSA:
        description: BeiDou DOP and active satellites
        aliasOf: GPGSA

      BDGSV:
        description: BeiDou Satellites in view
        aliasOf: GPGSV

      BDRMC:
        description: BeiDou Recommended minimum specific data
        aliasOf: GPRMC

      BDVTG:
        description: BeiDou Track and speed
        aliasOf: GPVTG

      BDZDA:
        description: BeiDou Time and date
        aliasOf: GPZDA

      AIVDM:
        description: AIS VHF Data-link Message (received AIS data)
        syntax:
          1:
            name: totalFragments
            type: long
          2:
            name: fragmentNumber
            type: long
          3:
            name: sequentialMessageId
            type: String
          4:
            name: radioChannel
            type: char
            param: '[{"A":"AIS channel A"},{"B":"AIS channel B"}]'
          5:
            name: payload
            type: String
          6:
            name: fillBits
            type: long

      AIVDO:
        description: AIS VHF Data-link Message (own-vessel AIS data)
        syntax:
          1:
            name: totalFragments
            type: long
          2:
            name: fragmentNumber
            type: long
          3:
            name: sequentialMessageId
            type: String
          4:
            name: radioChannel
            type: char
            param: '[{"A":"AIS channel A"},{"B":"AIS channel B"}]'
          5:
            name: payload
            type: String
          6:
            name: fillBits
            type: long

#
# Sonardyne Message extension
#
      PSONUSBL:
        description: Sonardyne USBL Report
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: beaconIndex
            type: long
          3:
            name: coordinateFrame
            type: Enum
            param: '[{"H":"Vehicle head up"},{"N":"North up"}]'
          4:
            name: eastOrStarboard
            type: double
          5:
            name: northOrForward
            type: double
          6:
            name: depth
            type: double
          7:
            name: pitch
            type: double
          8:
            name: roll
            type: double
          9:
            name: headingTrue
            type: double
          10:
            name: positionAccuracyOneSigma
            type: double

      PSONALL:
        description: Sonardyne General Position Report
        syntax:
          1:
            name: vehicleName
            type: String
          2:
            name: vehicleOffset
            type: String
          3:
            name: time
            type: UTCTime
          4:
            name: gridEasting
            type: double
          5:
            name: gridNorthing
            type: double
          6:
            name: depth
            type: double
          7:
            name: heading
            type: double
          8:
            name: courseMadeGood
            type: double
          9:
            name: headingType
            type: Enum
            param: '[{"G":"Grid"},{"T":"True"},{"M":"Magnetic"}]'
          10:
            name: pitch
            type: double
          11:
            name: roll
            type: double
          12:
            name: velocity
            type: double
          13:
            name: positionAccuracy95Percent
            type: double
          14:
            name: depthAccuracy
            type: double

      PSONDP:
        description: Sonardyne Dynamic Positioning Report
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: targetId
            type: String
          3:
            name: status
            type: Enum
            param: '[{"M":"Master"},{"S":"Slave"}]'
          4:
            name: qualityIndicator
            type: Enum
            param: '[{"0":"No Data"},{"1":"Degraded Data"},{"2":"Full Accuracy"}]'
          5:
            name: latitude
            type: Position
          6:
            name: longitude
            type: Position
          7:
            name: positionAccuracyMajorAxis
            type: double
          8:
            name: positionAccuracyMinorAxis
            type: double
          9:
            name: positionAccuracyDirectionTrue
            type: double
          10:
            name: depth
            type: double
          11:
            name: speedOverGround
            type: double
          12:
            name: courseOverGroundTrue
            type: double
          13:
            name: speedAccuracyMajorAxis
            type: double
          14:
            name: speedAccuracyMinorAxis
            type: double
          15:
            name: speedAccuracyDirectionTrue
            type: double
          16:
            name: pitch
            type: double
          17:
            name: roll
            type: double
          18:
            name: headingTrue
            type: double
          19:
            name: headingAccuracy
            type: double
          20:
            name: aiding
            type: String
          21:
            name: additionalDataType
            type: Enum
            param: '[{"N":"None"}]'
          22:
            name: additionalData1
            type: double
          23:
            name: additionalData2
            type: double
          24:
            name: additionalData3
            type: double

      PSONMEAS:
        description: Sonardyne Measurements Report
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: informationSource
            type: Enum
            param: '[{"INCINT":"Inclinometer with Heading"},{"INCEXT":"Inclinometer without Heading"},{"DEPTH":"Depth sensor"},{"TEMP":"Temperature sensor"},{"RNG":"Range measurement"}]'
          3:
            name: instrumentOrSourceName
            type: String
          4:
            name: sensorOrDestinationName
            type: String
          5:
            name: dataField1
            type: double
          6:
            name: dataField2
            type: double
          7:
            name: dataField3
            type: double

      PSONLLD:
        description: Sonardyne Latitude, Longitude and Depth Report
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: trackedObjectId
            type: String
          3:
            name: status
            type: Enum
            param: '[{"A":"Valid"},{"V":"Invalid"}]'
          4:
            name: latitude
            type: double
          5:
            name: longitude
            type: double
          6:
            name: depth
            type: double
          7:
            name: horizontalErrorMajorAxis
            type: double
          8:
            name: horizontalErrorMinorAxis
            type: double
          9:
            name: horizontalErrorDirectionTrue
            type: double
          10:
            name: depthError
            type: double
          11:
            name: optionalSpecifier
            type: String
          12:
            name: optionalField1
            type: String
          13:
            name: optionalField2
            type: String
          14:
            name: optionalField3
            type: String

      PSONSEQ:
        description: Sonardyne sequence or source identifier
        syntax:
          1:
            name: name
            type: String