---
NetworkManager:
    global:

      # ---------------------------------------------------------------------------------------------------------
      # tcp layer configuration
      # ---------------------------------------------------------------------------------------------------------
      receiveBufferSize: 128000
      sendBufferSize: 128000
      timeout: 60000
      backlog: 100
      soLingerDelaySec: 10
      readDelayOnFragmentation: 100
      fragmentationLimit: 5
      enableReadDelayOnFragmentation: true

      # ---------------------------------------------------------------------------------------------------------
      # Generic protocol configuration
      # ---------------------------------------------------------------------------------------------------------
      serverReadBufferSize: 100K
      serverWriteBufferSize: 100K
      selectorThreadCount: 10

      # ---------------------------------------------------------------------------------------------------------
      # MQTT Protocol configuration
      # ---------------------------------------------------------------------------------------------------------
      maximumSessionExpiry: 86400
      maximumBufferSize: 10M
      serverReceiveMaximum: 10
      clientReceiveMaximum: 65535
      clientMaximumTopicAlias: 32767
      serverMaximumTopicAlias: 0
      strictClientId: false

      # ---------------------------------------------------------------------------------------------------------
      # MQTT 5.0 specific
      # ---------------------------------------------------------------------------------------------------------
      minServerKeepAlive: 0
      maxServerKeepAlive: 60

      # ---------------------------------------------------------------------------------------------------------
      # LoRa Gateway specific
      # ---------------------------------------------------------------------------------------------------------
      # Maximum Packets per second limit to ensure the radio isn't flooded
      LoRaMaxTransmissionRate: 20

      # ---------------------------------------------------------------------------------------------------------
      # MQTT-SN specific configuration
      # ---------------------------------------------------------------------------------------------------------
      maxInFlightEvents: 1
      dropQoS0Events: true
      eventQueueTimeout: 0
      advertiseGateway: false
      enablePortChanges: true
      enableAddressChanges: true
      packetReuseTimeout: 1000

      # ---------------------------------------------------------------------------------------------------------
      # Global configuration
      # ---------------------------------------------------------------------------------------------------------
      discoverable: true             # If the server registers a mdns entry for the adapter
      preferIPv6Addresses: true      # If the server should prefer IPv6 addresses over IPv4 addresses
      scanNetworkChanges: true      # If true, the server will scan for new interfaces or disconnected interfaces
      scanInterval: 60000            # Time in milliseconds to scan for network changes

        # ---------------------------------------------------------------------------------------------------------
        # Global configuration for SSL
        # ---------------------------------------------------------------------------------------------------------
      security:
        tls:
          clientCertificateRequired: false
          clientCertificateWanted: false
            #-----------------------------------
            # CRL Specific
            # crlUrl: <URL TO CRL>
            # crlInterval: <time in seconds to reload CRL>
            #-----------------------------------

          keyStore:
            type: JKS
            managerFactory: SunX509
            path: my-keystore.jks
            passphrase: password

          trustStore:
            type: JKS
            path: my-truststore.jks
            passphrase: password
            managerFactory: SunX509

        dtls:
          clientCertificateRequired: false

          keyStore:
            type: JKS
            managerFactory: SunX509
            path: my-keystore.jks
            passphrase: password

          trustStore:
            type: JKS
            path: my-truststore.jks
            passphrase: password
            managerFactory: SunX509

    data:

      - name: "NMEA0183 Interface"
        url: udp://0.0.0.0:10110/
        protocol: NMEA-0183
        auth: default
        publish: true
        format: json

      - name: "MQTT Interface"
        url: tcp://0.0.0.0:1883/
        protocol: mqtt
        auth: default


      - name: "Mavlink Interface 1"
        url: udp://0.0.0.0:14550/
        protocol: mavlink
        auth: usernamePassword
        dialectName: "common"
        rejectedFrameNamespace: "/mavlink/dlq/{systemId}/{messageName}"
        topicNameTemplate: "/mavlink/{systemId}/{messageName}"
        statusTopicNameTemplate: "/mavlink/{systemId}/status"
        selectorThreadCount: "{processors}/2"

      - name: "Mavlink Interface 2"
        url: udp://0.0.0.0:14430/
        protocol: mavlink
        auth: usernamePassword
        dialectName: "ardupilot/ardupilotmega"

        rejectedFrameNamespace: "/mavlink/dlq/{systemId}/{messageName}"
        topicNameTemplate: "/mavlink/{systemId}/{messageName}"
        statusTopicNameTemplate: "/mavlink/{systemId}/status"
        selectorThreadCount: "{processors}/2"

        # Protocol-side source filtering and topic-name enrichment only.
        # No vehicleClass, no description, no twin metadata.
        acceptedSources:
          -
            systemId: 255
            componentId: 190
            acceptedMessageIds:
              - 0

          -
            systemId: 1
            componentId: 1

          -
            systemId: 1
            componentId: 50

          -
            systemId: 1
            componentId: 51

          -
            systemId: 1
            componentId: 52

          -
            systemId: 1
            componentId: 53

          -
            systemId: 1
            componentId: 115

          - systemId: 1
            componentId: 191

          - systemId: 2
            componentId: 1

          - systemId: 3
            componentId: 1

          -
            systemId: 4
            componentId: 1

          -
            systemId: 5
            componentId: 1

      - name: "Canbus N2K Interface"
        url: canbus://0.0.0.0/
        deviceName: can1
        protocol: n2k
        auth: default
        parseToJson: true
        canBusAddress: 123
        modelId: "Maps Messaging Server"
        modelSerialCode: "MAPS-CMRE-001"
        # Canbus Queue Configuration
        queuedWritesEnabled: true
        queueDepth: 128
        bitrateBitsPerSecond: 250000
        maxBusUsagePercent: 20.0
        queueFullPolicy: DROP_OLDEST
        writeFailureBackoffMilliseconds: 100
        ais:
          enabled: false

          pgn129039:
            enabled: true
            intervalMilliseconds: 5000

          pgn129040:
            enabled: false
            intervalMilliseconds: 2000

          pgn129809:
            enabled: true
            intervalMilliseconds: 300000

          pgn129810:
            enabled: true
            intervalMilliseconds: 300000



      -
        name: "Inmarsat Iot nano interface"
        protocol: satellite
        auth: anon
        url: satellite://inmarsat:0/
        httpRequestTimeoutSec: 30
        pollInterval: 5
        sharedSecret: "This is a shared secret to use"
        maxInflightEventsPerDevice: 2
        outboundNamespaceRoot: "/inmarsat/{deviceId}"
        outboundBroadcast: "/inmarsat/broadcast"
        outgoingMessagePollInterval: 5
        incomingMessagePollInterval: 4
        baseUrl: "http://localhost:8085/iotMessaging/v1"
        remoteAuthConfig:
          username: "this is not real"
          password: "this is just a junk password since we are in local mock test"

        mailboxId: "again not valid, not real"
        mailboxPassword: "whatever"
        namespaceRoot: "/{mailboxId}/"


