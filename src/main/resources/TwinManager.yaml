---
TwinManager:

  heartbeatTimeoutMillis: 5000
  staleTimeoutMillis: 10000
  retentionTimeoutMillis: 120000

  removeExpiredTwins: true
  defaultRootPath: "/"

  tak:
    hostname: "opentak.syd.mapsmessaging.io"
    port: 8088
    topic: "/tak/cot"

  geospatial:
    areas:
      - name: "sesimbra-usv"
        boundaries:
          - name: "offshore"
            type: "INSIDE"
            path: "geospatial/offshore.geojson"
          - name: "rio-1"
            type: "INSIDE"
            path: "geospatial/rio_1.geojson"
          - name: "rio-2"
            type: "INSIDE"
            path: "geospatial/rio_2.geojson"

        # Additional boundaries may use:
        #   type: "DO_NOT_ENTER"
        # A droneInfo entry selects this area with:
        #   geospatialArea: "sesimbra-usv"

      - name: "mwa"
        boundaries:
          - name: "MWA"
            type: "INSIDE"
            path: "geospatial/mwa.geojson"
