Sonardyne:
  format: json
  publish: true
  serverLocation: false
  sentenceForPosition: PSONLLD

  sentences:
    -
      PSONUSBL:
        description: Sonardyne USBL Report
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: beaconIndex
            type: long
          3:
            name: coordinateFrame
            type: Enum
            param: '[{"H":"Vehicle head up"},{"N":"North up"}]'
          4:
            name: eastOrStarboard
            type: double
          5:
            name: northOrForward
            type: double
          6:
            name: depth
            type: double
          7:
            name: pitch
            type: double
          8:
            name: roll
            type: double
          9:
            name: headingTrue
            type: double
          10:
            name: positionAccuracyOneSigma
            type: double

      PSONALL:
        description: Sonardyne General Position Report
        syntax:
          1:
            name: vehicleName
            type: String
          2:
            name: vehicleOffset
            type: String
          3:
            name: time
            type: UTCTime
          4:
            name: gridEasting
            type: double
          5:
            name: gridNorthing
            type: double
          6:
            name: depth
            type: double
          7:
            name: heading
            type: double
          8:
            name: courseMadeGood
            type: double
          9:
            name: headingType
            type: Enum
            param: '[{"G":"Grid"},{"T":"True"},{"M":"Magnetic"}]'
          10:
            name: pitch
            type: double
          11:
            name: roll
            type: double
          12:
            name: velocity
            type: double
          13:
            name: positionAccuracy95Percent
            type: double
          14:
            name: depthAccuracy
            type: double

      PSONDP:
        description: Sonardyne Dynamic Positioning Report
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: targetId
            type: String
          3:
            name: status
            type: Enum
            param: '[{"M":"Master"},{"S":"Slave"}]'
          4:
            name: qualityIndicator
            type: Enum
            param: '[{"0":"No Data"},{"1":"Degraded Data"},{"2":"Full Accuracy"}]'
          5:
            name: latitude
            type: Position
          6:
            name: longitude
            type: Position
          7:
            name: positionAccuracyMajorAxis
            type: double
          8:
            name: positionAccuracyMinorAxis
            type: double
          9:
            name: positionAccuracyDirectionTrue
            type: double
          10:
            name: depth
            type: double
          11:
            name: speedOverGround
            type: double
          12:
            name: courseOverGroundTrue
            type: double
          13:
            name: speedAccuracyMajorAxis
            type: double
          14:
            name: speedAccuracyMinorAxis
            type: double
          15:
            name: speedAccuracyDirectionTrue
            type: double
          16:
            name: pitch
            type: double
          17:
            name: roll
            type: double
          18:
            name: headingTrue
            type: double
          19:
            name: headingAccuracy
            type: double
          20:
            name: aiding
            type: String
          21:
            name: additionalDataType
            type: Enum
            param: '[{"N":"None"}]'
          22:
            name: additionalData1
            type: double
          23:
            name: additionalData2
            type: double
          24:
            name: additionalData3
            type: double

      PSONMEAS:
        description: Sonardyne Measurements Report
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: informationSource
            type: Enum
            param: '[{"INCINT":"Inclinometer with Heading"},{"INCEXT":"Inclinometer without Heading"},{"DEPTH":"Depth sensor"},{"TEMP":"Temperature sensor"},{"RNG":"Range measurement"}]'
          3:
            name: instrumentOrSourceName
            type: String
          4:
            name: sensorOrDestinationName
            type: String
          5:
            name: dataField1
            type: double
          6:
            name: dataField2
            type: double
          7:
            name: dataField3
            type: double

      PSONLLD:
        description: Sonardyne Latitude, Longitude and Depth Report
        syntax:
          1:
            name: time
            type: UTCTime
          2:
            name: trackedObjectId
            type: String
          3:
            name: status
            type: Enum
            param: '[{"A":"Valid"},{"V":"Invalid"}]'
          4:
            name: latitude
            type: double
          5:
            name: longitude
            type: double
          6:
            name: depth
            type: double
          7:
            name: horizontalErrorMajorAxis
            type: double
          8:
            name: horizontalErrorMinorAxis
            type: double
          9:
            name: horizontalErrorDirectionTrue
            type: double
          10:
            name: depthError
            type: double
          11:
            name: optionalSpecifier
            type: String
          12:
            name: optionalField1
            type: String
          13:
            name: optionalField2
            type: String
          14:
            name: optionalField3
            type: String