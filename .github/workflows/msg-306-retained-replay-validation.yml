name: MSG-306 retained replay validation

on:
  push:
    branches:
      - MSG-306-mqtt5-retained-replay

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare test resources
        run: mkdir -p src/test/resources
      - name: Compile
        run: mvn -B -DskipTests compile
      - name: Run MSG-306 tests
        run: >-
          mvn -B
          -Dtest=RetainedReplayMessageStateTest,MQTTRetainedReplayTest
          test
