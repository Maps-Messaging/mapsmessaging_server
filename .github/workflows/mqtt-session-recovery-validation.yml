name: MQTT session recovery validation

on:
  pull_request:
    branches:
      - development
    paths:
      - 'src/main/java/io/mapsmessaging/network/io/**'
      - 'src/main/java/io/mapsmessaging/network/ProtocolClientConnection.java'
      - 'src/main/java/io/mapsmessaging/network/protocol/impl/mqtt/**'
      - 'src/main/java/io/mapsmessaging/network/protocol/impl/mqtt5/**'
      - 'src/main/java/io/mapsmessaging/engine/session/**'
      - 'src/main/java/io/mapsmessaging/engine/destination/subscription/**'
      - 'src/test/java/io/mapsmessaging/network/io/**'
      - 'src/test/java/io/mapsmessaging/network/protocol/impl/mqtt/**'
      - 'src/test/java/io/mapsmessaging/engine/destination/subscription/**'
      - '.github/workflows/mqtt-session-recovery-validation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare test resources
        run: mkdir -p src/test/resources
      - name: Run MQTT delivery and flow-control tests
        run: >-
          mvn -B
          -Dtest=FrameHandlerTest,PacketIdManagerTest,DestinationSubscriptionFlowControlTest
          test
