name: WP33 PR workspace export v2

on:
  pull_request:
    branches:
      - development

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create workspace archive
        run: tar --exclude=.git --exclude=mapsmessaging-server-development.tar.gz -czf mapsmessaging-server-development.tar.gz .

      - name: Upload workspace archive
        uses: actions/upload-artifact@v4
        with:
          name: wp33-workspace-pr-v2
          path: mapsmessaging-server-development.tar.gz
          if-no-files-found: error
          retention-days: 1
