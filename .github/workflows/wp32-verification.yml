name: WP32 verification

on:
  push:
    branches:
      - review/state-n2k-core

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run WP32 targeted tests
        run: >-
          mvn -B -Dlicense.fetch.skip=true
          -Dtest=N2kSessionTest,N2kTwinUpdaterTest,DroneMonitorTest,AbstractDronePgnHandlerTest,AisHandlersTest
          test

      - name: Run complete test suite
        run: mvn -B -Dlicense.fetch.skip=true test

      - name: Calculate assigned-package coverage
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('target/site/jacoco/jacoco.xml')
          result = {'available': report.exists()}
          if report.exists():
              root = ET.parse(report).getroot()
              counters = {'LINE': [0, 0], 'BRANCH': [0, 0], 'METHOD': [0, 0]}
              for package in root.findall('package'):
                  name = package.get('name', '')
                  if name == 'io/mapsmessaging/state/n2k' or name == 'io/mapsmessaging/state/n2k/handler':
                      for counter in package.findall('counter'):
                          kind = counter.get('type')
                          if kind in counters:
                              counters[kind][0] += int(counter.get('missed', '0'))
                              counters[kind][1] += int(counter.get('covered', '0'))
              for kind, (missed, covered) in counters.items():
                  total = missed + covered
                  result[kind.lower()] = {
                      'missed': missed,
                      'covered': covered,
                      'total': total,
                      'percent': round(covered * 100.0 / total, 1) if total else None,
                  }
          Path('target/wp32-coverage.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp32-verification-reports
          path: |
            target/surefire-reports
            target/site/jacoco/jacoco.xml
            target/wp32-coverage.json
          if-no-files-found: warn
