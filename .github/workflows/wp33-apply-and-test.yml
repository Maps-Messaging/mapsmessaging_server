name: WP33 apply and test

on:
  pull_request:
    branches:
      - development

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure review workspace
        run: |
          git config user.name "WP33 Review Agent"
          git config user.email "actions@github.com"
          mkdir -p .wp33-results
          echo "BASE_SHA=9455754a92ffb5136e1d15f0efd749a5dc20d838" | tee .wp33-results/base.txt
          echo "BASE_TREE=$(git rev-parse '9455754a92ffb5136e1d15f0efd749a5dc20d838^{tree}')" | tee -a .wp33-results/base.txt

      - name: Add regression tests
        run: |
          base64 --decode .wp33/tests.tar.gz.b64 | tar -xz
          git add src/test/java/io/mapsmessaging/state/n2k
          git commit -m "test(n2k): add listener and AIS mapping regression coverage" -m "NO-ISSUE"

      - name: Apply production fixes
        run: |
          base64 --decode .wp33/production.tar.gz.b64 | tar -xz
          touch \
            src/main/java/io/mapsmessaging/state/n2k/listener/AbstractN2kJsonListener.java \
            src/main/java/io/mapsmessaging/state/n2k/listener/N2kJsonListenerRegistry.java \
            src/main/java/io/mapsmessaging/state/n2k/msg/AisMappingSupport.java \
            src/main/java/io/mapsmessaging/state/n2k/msg/mapper/AisClassBPositionMapper.java \
            src/main/java/io/mapsmessaging/state/n2k/msg/mapper/AisClassBExtendedPositionMapper.java
          git add \
            src/main/java/io/mapsmessaging/state/n2k/listener/AbstractN2kJsonListener.java \
            src/main/java/io/mapsmessaging/state/n2k/listener/N2kJsonListenerRegistry.java \
            src/main/java/io/mapsmessaging/state/n2k/msg/AisMappingSupport.java \
            src/main/java/io/mapsmessaging/state/n2k/msg/mapper/AisClassBPositionMapper.java \
            src/main/java/io/mapsmessaging/state/n2k/msg/mapper/AisClassBExtendedPositionMapper.java
          git commit \
            -m "fix(n2k): harden listener parsing and AIS mapping" \
            -m "Reject malformed and non-finite listener fields without losing usable sibling data. Reject duplicate PGN registrations and invalid AIS positions, and honour configured callsign fallbacks." \
            -m "NO-ISSUE"

      - name: Run targeted WP33 tests
        run: |
          mvn -B -Dstyle.color=never -Dtest=AbstractN2kJsonListenerTest,N2kJsonDispatcherTest,N2kNavigationListenersTest,N2kPowerEnvironmentalListenersTest,AisMappingSupportTest,AisClassBMappersTest,AisFieldValueSourceTest test | tee .wp33-results/targeted.log
          cp target/site/jacoco/jacoco.xml .wp33-results/targeted-jacoco.xml

      - name: Calculate assigned-package coverage
        run: |
          python3 - <<'PY' | tee .wp33-results/targeted-coverage.txt
          import xml.etree.ElementTree as ET

          root = ET.parse('.wp33-results/targeted-jacoco.xml').getroot()
          prefixes = (
              'io/mapsmessaging/state/n2k/listener',
              'io/mapsmessaging/state/n2k/msg',
          )
          totals = {kind: [0, 0] for kind in ('LINE', 'BRANCH', 'METHOD')}
          packages = []
          for package in root.findall('package'):
              name = package.get('name', '')
              if not name.startswith(prefixes):
                  continue
              packages.append(name)
              for counter in package.findall('counter'):
                  kind = counter.get('type')
                  if kind in totals:
                      totals[kind][0] += int(counter.get('missed', '0'))
                      totals[kind][1] += int(counter.get('covered', '0'))

          print('Packages measured:')
          for name in sorted(packages):
              print(f'  {name}')
          for kind in ('LINE', 'BRANCH', 'METHOD'):
              missed, covered = totals[kind]
              total = missed + covered
              percent = 100.0 * covered / total if total else 0.0
              print(f'{kind}: {covered}/{total} ({percent:.1f}%)')
          PY

      - name: Record broad-suite attempt
        run: |
          printf '%s\n' \
            'A separate mvn -B -Dstyle.color=never test run was started in workflow run 30406258144.' \
            'It exceeded 40 minutes after the targeted tests completed and was decoupled from branch finalisation.' \
            > .wp33-results/full-suite-attempt.txt

      - name: Remove temporary review scaffolding and push
        run: |
          git rm -f \
            .wp33/tests.tar.gz.b64 \
            .wp33/production.tar.gz.b64 \
            .github/workflows/wp33-workspace-export.yml \
            .github/workflows/wp33-pr-export.yml \
            .github/workflows/wp33-pr-export-v2.yml \
            .github/workflows/wp33-pr-export-v3.yml \
            .github/workflows/wp33-head-tree.yml \
            .github/workflows/wp33-apply-and-test.yml
          git commit -m "chore(n2k): remove temporary review scaffolding" -m "NO-ISSUE"
          git push origin HEAD:review/state-n2k-mapping

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp33-review-evidence-final
          path: .wp33-results
          if-no-files-found: warn
          retention-days: 7
