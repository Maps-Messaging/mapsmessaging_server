name: WP33 workspace export

on:
  push:
    branches:
      - review/state-n2k-mapping

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create workspace archive
        run: tar --exclude=.git -czf ../mapsmessaging-server-development.tar.gz .

      - name: Upload workspace archive
        uses: actions/upload-artifact@v4
        with:
          name: wp33-workspace
          path: ../mapsmessaging-server-development.tar.gz
          if-no-files-found: error
          retention-days: 1
